name: junoyi-${APP_ENV:?请通过 --env-file 选择 dev、test 或 prod}

services:
  backend:
    image: junoyi-backend:${APP_ENV}
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    env_file:
      - ./env/${APP_ENV}.env
    environment:
      SPRING_PROFILES_ACTIVE: docker,${APP_ENV}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
      JWT_SECRET: ${JWT_SECRET:?请在环境文件中设置至少 64 字符的 JWT_SECRET}
    volumes:
      - ./config:/app/config:ro
      - backend-data:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-7588}:7588"
    expose:
      - "7588"
    restart: unless-stopped
    networks:
      - app

networks:
  app:

volumes:
  backend-data:
